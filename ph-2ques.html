<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Class 11 Chapter 1 - 100 Questions Revision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1a1f3a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #cbd5e1;
            font-weight: 300;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .stat-card {
            background: rgba(30, 58, 95, 0.5);
            border: 1px solid rgba(96, 165, 250, 0.3);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            background: transparent;
            color: #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }

        .questions-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 20px;
            animation: fadeIn 0.8s ease 0.4s both;
        }

        .question-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(96, 165, 250, 0.2);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #60a5fa, #34d399);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .question-card:hover {
            border-color: #60a5fa;
            background: rgba(30, 58, 95, 0.4);
            transform: translateY(-5px);
        }

        .question-card:hover::before {
            opacity: 1;
        }

        .q-number {
            display: inline-block;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            color: #0f172a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .q-type {
            display: inline-block;
            margin-left: 10px;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .q-type.mcq {
            background: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }

        .q-type.short {
            background: rgba(52, 211, 153, 0.3);
            color: #86efac;
        }

        .q-type.long {
            background: rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
        }

        .q-type.numerical {
            background: rgba(251, 146, 60, 0.3);
            color: #fed7aa;
        }

        .question-text {
            font-size: 1em;
            line-height: 1.6;
            margin-top: 15px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .question-options {
            margin-top: 15px;
            display: none;
        }

        .question-card.expanded .question-options {
            display: block;
        }

        .option {
            padding: 10px;
            margin: 8px 0;
            background: rgba(96, 165, 250, 0.1);
            border-left: 3px solid #60a5fa;
            border-radius: 4px;
            font-size: 0.95em;
            color: #cbd5e1;
        }

        .solution {
            margin-top: 15px;
            padding: 15px;
            background: rgba(52, 211, 153, 0.1);
            border-left: 3px solid #34d399;
            border-radius: 4px;
            display: none;
            font-size: 0.95em;
            color: #d1fae5;
        }

        .question-card.expanded .solution {
            display: block;
        }

        .difficulty {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.85em;
            color: #94a3b8;
        }

        .difficulty-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .difficulty-dot.easy {
            background: #34d399;
        }

        .difficulty-dot.medium {
            background: #fbbf24;
        }

        .difficulty-dot.hard {
            background: #f87171;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            background: rgba(30, 58, 95, 0.5);
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(30, 58, 95, 0.7);
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .topic-section {
            margin-bottom: 50px;
        }

        .topic-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(96, 165, 250, 0.3);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #64748b;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .questions-container {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

            const byTopic = {};
            filteredQuestions.forEach(q => {
                if (!byTopic[q.topic]) byTopic[q.topic] = [];
                byTopic[q.topic].push(q);
            });

            // Render topics
            Object.entries(byTopic).forEach(([topic, questions]) => {
                const section = document.createElement('div');
                section.className = 'topic-section';
                section.innerHTML = `<h2 class="topic-title">${topic} (${questions.length} questions)</h2>`;

                const container = document.createElement('div');
                container.className = 'questions-container';

                questions.forEach(q => {
                    container.appendChild(createQuestionCard(q));
                });

                section.appendChild(container);
                wrapper.appendChild(section);
            });
        }

        function createQuestionCard(q) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.onclick = () => card.classList.toggle('expanded');

            const diffColor = q.difficulty === 'easy' ? 'easy' : q.difficulty === 'medium' ? 'medium' : 'hard';

            let optionsHTML = '';
            if (q.options.length > 0) {
                const choices = ['A)', 'B)', 'C)', 'D)'];
                optionsHTML = '<div class="question-options"><strong>Options:</strong>' + 
                    q.options.map((opt, i) => `<div class="option">${choices[i]} ${opt}</div>`).join('') + 
                    '</div>';
            }

            card.innerHTML = `
                <div>
                    <span class="q-number">Q${q.number}</span>
                    <span class="q-type ${q.type}">${q.type}</span>
                    <span class="difficulty">
                        <span class="difficulty-dot ${diffColor}"></span>${q.difficulty}
                    </span>
                </div>
                <div class="question-text">${q.question}</div>
                ${optionsHTML}
                <div class="solution">
                    <strong>✓ Solution:</strong><br>${q.solution}<br>
                    ${q.answer ? `<strong>Answer:</strong> ${q.answer}` : ''}
                </div>
            `;

            return card;
        }

        function filterQuestions(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuestions();
        }

        document.getElementById('searchBox').addEventListener('keyup', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.question-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        // Initial render
        renderQuestions();
    </script>
</body>
</html>
